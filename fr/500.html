<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erreur serveur — Centifi</title>
    <meta name="description" content="Le site Centifi rencontre un problème temporaire." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://centifi.app/fr/500.html" />
    <meta name="theme-color" content="#6c63ff" />
    <link rel="icon" type="image/png" sizes="48x48" href="https://centifi.app/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="https://centifi.app/assets/favicon-96.png" />
    <link rel="icon" href="https://centifi.app/assets/centifi-logo.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var k = "centifi-site-theme";
          var t = localStorage.getItem(k);
          var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var th = t === "light" || t === "dark" ? t : d ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", th);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-lang="fr" data-page="error" data-depth="1">
    <header class="nav">
      <div class="wrap nav-strip">
        <div class="error-nav-inner">
          <a class="logo" href="/fr/">
            <img
              src="/assets/centifi-logo.svg"
              alt=""
              width="36"
              height="36"
              decoding="async"
              class="logo-img"
            />
            <span class="logo-text">Centifi</span>
          </a>
          <a class="btn-nav" href="/fr/">Retour à l’accueil</a>
        </div>
      </div>
    </header>

    <main class="wrap error-page-main">
      <p class="error-code" aria-hidden="true">500</p>
      <h1>Une erreur est survenue</h1>
      <p class="error-lead">
        Nous rencontrons un problème temporaire. Veuillez réessayer dans un instant. Si le problème continue,
        ouvrez la page d’accueil ci-dessous.
      </p>
      <div class="error-actions">
        <a class="btn-nav" href="/fr/">Accueil Centifi</a>
      </div>
      <p class="error-lang-note">
        <a href="/">English</a> · <a href="/tr/">Türkçe</a> · <a href="/de/">Deutsch</a> ·
        <a href="/fr/">Français</a> · <a href="/es/">Español</a>
      </p>
    </main>

    <footer>
      <div class="wrap">
        <p class="copyright">© <span class="copyright-year"></span> Centifi. Tous droits réservés.</p>
      </div>
    </footer>
    <script src="/assets/site.js" defer></script>
  </body>
</html>
