<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página no encontrada — Centifi</title>
    <meta name="description" content="No se encontró la página de Centifi solicitada." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://centifi.app/es/404.html" />
    <meta name="theme-color" content="#6c63ff" />
    <link rel="icon" type="image/png" sizes="48x48" href="https://centifi.app/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="https://centifi.app/assets/favicon-96.png" />
    <link rel="icon" href="https://centifi.app/assets/centifi-logo.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var k = "centifi-site-theme";
          var t = localStorage.getItem(k);
          var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var th = t === "light" || t === "dark" ? t : d ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", th);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-lang="es" data-page="error" data-depth="1">
    <header class="nav">
      <div class="wrap nav-strip">
        <div class="error-nav-inner">
          <a class="logo" href="index.html">
            <img
              src="../assets/centifi-logo.svg"
              alt=""
              width="36"
              height="36"
              decoding="async"
              class="logo-img"
            />
            <span class="logo-text">Centifi</span>
          </a>
          <a class="btn-nav" href="index.html">Volver al inicio</a>
        </div>
      </div>
    </header>

    <main class="wrap error-page-main">
      <p class="error-code" aria-hidden="true">404</p>
      <h1>Página no encontrada</h1>
      <p class="error-lead">
        El enlace puede ser incorrecto o la página se ha eliminado. Prueba la página de inicio o elige otro idioma
        abajo.
      </p>
      <div class="error-actions">
        <a class="btn-nav" href="index.html">Inicio de Centifi</a>
      </div>
      <p class="error-lang-note">
        <a href="../index.html">English</a> · <a href="../tr/">Türkçe</a> · <a href="../de/">Deutsch</a> ·
        <a href="../fr/">Français</a> · <a href="index.html">Español</a>
      </p>
    </main>

    <footer>
      <div class="wrap">
        <p class="copyright">© <span class="copyright-year"></span> Centifi. Todos los derechos reservados.</p>
      </div>
    </footer>
    <script src="../assets/site.js" defer></script>
  </body>
</html>
