<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test kullanıcısı ol — Centifi</title>
    <meta name="description" content="Centifi’yi iOS veya Android’de erken denemek için başvurun." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://centifi.app/tr/test-users.html" />
    <meta name="centifi-api-base" content="https://centifi-backend-production.up.railway.app" />
    <meta name="theme-color" content="#6c63ff" />
    <link rel="icon" type="image/png" sizes="48x48" href="https://centifi.app/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="https://centifi.app/assets/favicon-96.png" />
    <link rel="icon" href="https://centifi.app/assets/centifi-logo.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var k = "centifi-site-theme";
          var t = localStorage.getItem(k);
          var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var th = t === "light" || t === "dark" ? t : d ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", th);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-lang="tr" data-page="test-users" data-depth="1">
    <header class="nav">
      <div class="nav-overlay" id="nav-overlay" hidden></div>
      <div class="wrap nav-strip">
        <div class="nav-inner">
          <a class="logo" href="/tr/">
            <img src="/assets/centifi-logo.svg" alt="" width="36" height="36" decoding="async" class="logo-img" />
            <span class="logo-text">Centifi</span>
          </a>
          <button type="button" class="nav-menu-toggle" id="nav-menu-toggle" aria-expanded="false" aria-controls="nav-drawer">
            <span class="visually-hidden">Menu</span>
            <span class="nav-menu-toggle-bars" aria-hidden="true">
              <span class="nav-menu-toggle-line"></span>
              <span class="nav-menu-toggle-line"></span>
              <span class="nav-menu-toggle-line"></span>
            </span>
          </button>
          <nav class="nav-drawer" id="nav-drawer" aria-label="Primary">
            <div class="nav-drawer-shell">
              <ul class="nav-links">
                <li><a href="/tr/#features">Özellikler</a></li>
                <li><a class="btn-nav" href="/tr/#download">İndir</a></li>
              </ul>
              <div class="nav-controls">
                <span id="centifi-lang-label" class="visually-hidden">Language</span>
                <div class="lang-dropdown" id="centifi-lang-dropdown">
                  <button
                    type="button"
                    class="lang-dropdown-trigger"
                    id="centifi-lang-trigger"
                    aria-expanded="false"
                    aria-haspopup="listbox"
                    aria-controls="centifi-lang-list"
                    aria-labelledby="centifi-lang-label"
                  >
                    <span class="lang-dropdown-value"><span class="lang-flag" aria-hidden="true">🇹🇷</span> Türkçe</span>
                    <svg class="lang-dropdown-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M3 4.5 6 7.5 9 4.5"/></svg>
                  </button>
                  <ul class="lang-dropdown-list" id="centifi-lang-list" role="listbox" hidden>
                <li role="presentation">
                  <button type="button" role="option" class="lang-dropdown-option" data-lang="en" aria-selected="false">
                    <span class="lang-flag" aria-hidden="true">🇬🇧</span> English
                  </button>
                </li>
                <li role="presentation">
                  <button type="button" role="option" class="lang-dropdown-option is-active" data-lang="tr" aria-selected="true">
                    <span class="lang-flag" aria-hidden="true">🇹🇷</span> Türkçe
                  </button>
                </li>
                <li role="presentation">
                  <button type="button" role="option" class="lang-dropdown-option" data-lang="de" aria-selected="false">
                    <span class="lang-flag" aria-hidden="true">🇩🇪</span> Deutsch
                  </button>
                </li>
                <li role="presentation">
                  <button type="button" role="option" class="lang-dropdown-option" data-lang="fr" aria-selected="false">
                    <span class="lang-flag" aria-hidden="true">🇫🇷</span> Français
                  </button>
                </li>
                <li role="presentation">
                  <button type="button" role="option" class="lang-dropdown-option" data-lang="es" aria-selected="false">
                    <span class="lang-flag" aria-hidden="true">🇪🇸</span> Español
                  </button>
                </li>
                  </ul>
                </div>
                <button type="button" class="theme-toggle" id="centifi-theme" aria-pressed="true" aria-label="Switch to light mode">☀️</button>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <main class="wrap feedback-page page-main">
      <h1>Test kullanıcısı ol</h1>
      <p class="feedback-lead">Centifi’ye erken erişim mi istiyorsunuz? E-postanızı ve platformunuzu bırakın — yer açıldığında sizinle iletişime geçeriz.</p>

      <form id="centifi-test-users-form" class="feedback-form" novalidate>
        <div class="feedback-field">
          <label for="test-users-platform-trigger" id="test-users-platform-label">Platform <span class="feedback-required">*</span></label>
          <div class="form-dropdown lang-dropdown" id="test-users-platform-dropdown">
            <button
              type="button"
              class="lang-dropdown-trigger"
              id="test-users-platform-trigger"
              aria-expanded="false"
              aria-haspopup="listbox"
              aria-controls="test-users-platform-list"
              aria-labelledby="test-users-platform-label"
            >
              <span class="lang-dropdown-value" id="test-users-platform-value">
                <span class="form-dropdown-placeholder" id="test-users-platform-placeholder">Select…</span>
              </span>
              <svg class="lang-dropdown-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M3 4.5 6 7.5 9 4.5"/></svg>
            </button>
            <ul class="lang-dropdown-list" id="test-users-platform-list" role="listbox" hidden>
              <li role="presentation">
                <button type="button" role="option" class="lang-dropdown-option" data-value="ios" aria-selected="false">
                  <span class="lang-flag" aria-hidden="true">🍎</span>
                  <span class="platform-option-label">iOS</span>
                </button>
              </li>
              <li role="presentation">
                <button type="button" role="option" class="lang-dropdown-option" data-value="android" aria-selected="false">
                  <span class="lang-flag" aria-hidden="true">🤖</span>
                  <span class="platform-option-label">Android</span>
                </button>
              </li>
            </ul>
            <input type="hidden" id="test-users-platform" name="platform" value="" />
          </div>
        </div>
        <div class="feedback-field">
          <label for="test-users-email" id="test-users-email-label">Email <span class="feedback-required">*</span></label>
          <input id="test-users-email" name="email" type="email" autocomplete="email" required maxlength="254" />
        </div>
        <div class="feedback-hp" aria-hidden="true">
          <label for="test-users-website">Website</label>
          <input id="test-users-website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <p class="feedback-status" id="test-users-status" role="status" aria-live="polite" hidden></p>
        <div class="feedback-actions">
          <button type="submit" class="cookie-btn cookie-btn--primary" id="test-users-submit">Apply</button>
        </div>
      </form>

      <p class="feedback-alt">
        <span id="test-users-alt-text">Questions?</span>
        <a href="feedback.html" id="test-users-alt-link">Send feedback</a>
      </p>
    </main>

    <footer>
      <div class="wrap">
        <p class="copyright">© <span class="copyright-year"></span> Centifi. All rights reserved.</p>
      </div>
    </footer>
    <script src="/assets/site.js" defer></script>
  </body>
</html>
